<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品 - Ryan Mall</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/ai_chat.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-shop"></i> Ryan Mall</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="products.html">商品</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">购物车 <span class="badge bg-danger" id="cartCount">0</span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="orders.html">订单</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="login.html" id="loginLink"><i class="bi bi-person"></i> 登录</a>
                    </li>
                    <li class="nav-item d-none" id="userMenu">
                        <div class="dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                                <i class="bi bi-person-circle"></i> <span id="username"></span>
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="orders.html">我的订单</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="#" onclick="logout()">退出登录</a></li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Search Header -->
    <section class="search-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6 text-center">
                    <h2 style="font-family: var(--font-display); font-weight: 700; font-size: 2rem; letter-spacing: -0.02em; margin-bottom: 16px;">发现好商品</h2>
                    <div class="input-group" style="border: 1.5px solid var(--border); border-radius: var(--radius-md); overflow: hidden; background: var(--bg-card);">
                        <input type="text" class="form-control" placeholder="搜索商品名称..." id="searchInput" style="border: none; padding: 14px 20px; box-shadow: none;">
                        <button class="btn btn-primary" type="button" onclick="searchProducts()" style="border-radius: 0; padding: 14px 24px;">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <div class="container" style="padding: 48px 0;">
        <!-- Filters -->
        <div class="filter-section">
            <div class="row align-items-end g-3">
                <div class="col-md-3">
                    <label class="form-label" style="font-size: 0.82rem; font-weight: 500; color: var(--text-secondary);">分类</label>
                    <select class="form-select" id="categoryFilter">
                        <option value="">全部分类</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label" style="font-size: 0.82rem; font-weight: 500; color: var(--text-secondary);">价格</label>
                    <select class="form-select" id="priceFilter">
                        <option value="">全部价格</option>
                        <option value="0-100">0 - 100</option>
                        <option value="100-500">100 - 500</option>
                        <option value="500-1000">500 - 1000</option>
                        <option value="1000+">1000+</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label" style="font-size: 0.82rem; font-weight: 500; color: var(--text-secondary);">排序</label>
                    <select class="form-select" id="sortFilter">
                        <option value="created_at desc">最新上架</option>
                        <option value="price asc">价格升序</option>
                        <option value="price desc">价格降序</option>
                        <option value="name asc">名称 A-Z</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100" onclick="applyFilters()">
                        <i class="bi bi-funnel"></i> 筛选
                    </button>
                </div>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading" style="display: none;">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <p style="margin-top: 16px; font-size: 0.9rem;">正在加载商品...</p>
        </div>

        <!-- Product Grid -->
        <div class="row" id="productList">
        </div>

        <!-- Pagination -->
        <nav aria-label="商品分页" class="mt-5">
            <ul class="pagination justify-content-center" id="pagination">
            </ul>
        </nav>
    </div>

    <!-- Product Detail Modal -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="productModalTitle">商品详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="productModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" onclick="addToCart()">
                        <i class="bi bi-cart-plus"></i> 加入购物车
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8080/api/v1';

        let currentPage = 1;
        let currentFilters = {};
        let selectedProduct = null;

        document.addEventListener('DOMContentLoaded', function() {
            checkLoginStatus();
            loadCategories();
            loadProducts();
        });

        function checkLoginStatus() {
            const token = localStorage.getItem('token');
            const username = localStorage.getItem('username');
            if (token && username) {
                document.getElementById('loginLink').classList.add('d-none');
                document.getElementById('userMenu').classList.remove('d-none');
                document.getElementById('username').textContent = username;
            }
        }

        async function loadCategories() {
            try {
                const response = await fetch(`${API_BASE}/categories`);
                const data = await response.json();
                if (data.code === 200) {
                    const select = document.getElementById('categoryFilter');
                    data.data.forEach(category => {
                        const option = document.createElement('option');
                        option.value = category.id;
                        option.textContent = category.name;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('加载分类失败:', error);
            }
        }

        async function loadProducts(page = 1) {
            showLoading(true);
            try {
                let url = `${API_BASE}/products?page=${page}&limit=12`;
                if (currentFilters.category) url += `&category_id=${currentFilters.category}`;
                if (currentFilters.search) url += `&search=${encodeURIComponent(currentFilters.search)}`;
                if (currentFilters.sort) url += `&sort=${currentFilters.sort}`;
                if (currentFilters.min_price) url += `&min_price=${currentFilters.min_price}`;
                if (currentFilters.max_price) url += `&max_price=${currentFilters.max_price}`;

                const response = await fetch(url);
                const data = await response.json();

                if (data.code === 200) {
                    renderProducts(data.data.products || []);
                    renderPagination(data.data.pagination || {});
                } else {
                    showError('加载商品失败: ' + data.message);
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
            } finally {
                showLoading(false);
            }
        }

        function renderProducts(products) {
            const container = document.getElementById('productList');
            if (products.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center" style="padding: 80px 20px;">
                        <i class="bi bi-box" style="font-size: 3rem; color: var(--border);"></i>
                        <h5 style="color: var(--text-secondary); margin-top: 16px; font-family: var(--font-display);">暂无商品</h5>
                        <p style="color: var(--text-tertiary); font-size: 0.88rem;">请尝试调整筛选条件</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = products.map(product => `
                <div class="col-md-4 col-lg-3 mb-4">
                    <div class="card product-card">
                        <div class="product-image">
                            <i class="bi bi-image" style="font-size: 2.5rem;"></i>
                        </div>
                        <div class="card-body" style="padding: 20px;">
                            <h6 style="font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; margin-bottom: 6px;">${product.name}</h6>
                            <p style="color: var(--text-tertiary); font-size: 0.8rem; margin-bottom: 12px; line-height: 1.4;">${product.description || '暂无描述'}</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="price">&yen;${product.price}</span>
                                    ${product.original_price ? `<span class="original-price ms-1">&yen;${product.original_price}</span>` : ''}
                                </div>
                                <small style="color: var(--text-tertiary); font-size: 0.75rem;">库存 ${product.stock}</small>
                            </div>
                        </div>
                        <div class="card-footer">
                            <button class="btn btn-outline-primary btn-sm w-100" onclick="showProductDetail(${product.id})">
                                查看详情
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function showProductDetail(productId) {
            try {
                const response = await fetch(`${API_BASE}/products/${productId}`);
                const data = await response.json();
                if (data.code === 200) {
                    selectedProduct = data.data;
                    const modal = new bootstrap.Modal(document.getElementById('productModal'));
                    document.getElementById('productModalTitle').textContent = selectedProduct.name;
                    document.getElementById('productModalBody').innerHTML = `
                        <div class="row">
                            <div class="col-md-5">
                                <div class="product-image" style="height: 260px; border-radius: var(--radius-md);">
                                    <i class="bi bi-image" style="font-size: 3rem;"></i>
                                </div>
                            </div>
                            <div class="col-md-7">
                                <h5 style="font-family: var(--font-display); font-weight: 600;">${selectedProduct.name}</h5>
                                <p style="color: var(--text-secondary); font-size: 0.9rem;">${selectedProduct.description || '暂无描述'}</p>
                                <div style="margin: 20px 0;">
                                    <span class="price" style="font-size: 1.5rem;">&yen;${selectedProduct.price}</span>
                                    ${selectedProduct.original_price ? `<span class="original-price ms-2">&yen;${selectedProduct.original_price}</span>` : ''}
                                </div>
                                <div style="font-size: 0.88rem; color: var(--text-secondary);">
                                    <p style="margin-bottom: 8px;"><strong>库存:</strong> ${selectedProduct.stock} 件</p>
                                    <p style="margin-bottom: 8px;"><strong>分类:</strong> ${selectedProduct.category?.name || '未分类'}</p>
                                    <p style="margin-bottom: 0;"><strong>状态:</strong>
                                        <span class="badge ${selectedProduct.status === 1 ? 'bg-success' : 'bg-secondary'}">
                                            ${selectedProduct.status === 1 ? '在售' : '下架'}
                                        </span>
                                    </p>
                                </div>
                            </div>
                        </div>
                    `;
                    modal.show();
                }
            } catch (error) {
                showError('获取商品详情失败');
            }
        }

        function searchProducts() {
            currentFilters.search = document.getElementById('searchInput').value.trim();
            currentPage = 1;
            loadProducts(currentPage);
        }

        function applyFilters() {
            const category = document.getElementById('categoryFilter').value;
            const priceRange = document.getElementById('priceFilter').value;
            const sort = document.getElementById('sortFilter').value;

            currentFilters.category = category;
            currentFilters.sort = sort;

            if (priceRange) {
                if (priceRange === '1000+') {
                    currentFilters.min_price = 1000;
                    delete currentFilters.max_price;
                } else {
                    const [min, max] = priceRange.split('-').map(Number);
                    currentFilters.min_price = min;
                    currentFilters.max_price = max;
                }
            } else {
                delete currentFilters.min_price;
                delete currentFilters.max_price;
            }

            currentPage = 1;
            loadProducts(currentPage);
        }

        async function addToCart() {
            if (!selectedProduct) return;
            try {
                const success = await CartManager.addToCart(selectedProduct.id, 1);
                if (success) {
                    updateCartCount();
                    bootstrap.Modal.getInstance(document.getElementById('productModal')).hide();
                }
            } catch (error) {
                Utils.showToast('网络错误，请稍后重试', 'danger');
            }
        }

        async function updateCartCount() {
            const token = localStorage.getItem('token');
            if (!token) return;
            try {
                const response = await fetch(`${API_BASE}/cart`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.code === 200) {
                    document.getElementById('cartCount').textContent = data.data.items?.length || 0;
                }
            } catch (error) {}
        }

        function renderPagination(pagination) {
            const container = document.getElementById('pagination');
            if (!pagination.total_pages || pagination.total_pages <= 1) {
                container.innerHTML = '';
                return;
            }
            let html = '';
            if (pagination.current_page > 1) {
                html += `<li class="page-item"><a class="page-link" href="#" onclick="loadProducts(${pagination.current_page - 1})">上一页</a></li>`;
            }
            for (let i = 1; i <= pagination.total_pages; i++) {
                html += i === pagination.current_page
                    ? `<li class="page-item active"><span class="page-link">${i}</span></li>`
                    : `<li class="page-item"><a class="page-link" href="#" onclick="loadProducts(${i})">${i}</a></li>`;
            }
            if (pagination.current_page < pagination.total_pages) {
                html += `<li class="page-item"><a class="page-link" href="#" onclick="loadProducts(${pagination.current_page + 1})">下一页</a></li>`;
            }
            container.innerHTML = html;
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
            document.getElementById('productList').style.display = show ? 'none' : 'flex';
        }

        function showError(message) {
            document.getElementById('productList').innerHTML = `
                <div class="col-12 text-center" style="padding: 80px 20px;">
                    <i class="bi bi-exclamation-triangle" style="font-size: 3rem; color: var(--border);"></i>
                    <h5 style="color: var(--text-secondary); margin-top: 16px;">加载失败</h5>
                    <p style="color: var(--text-tertiary); font-size: 0.88rem;">${message}</p>
                    <button class="btn btn-primary" onclick="loadProducts()">重新加载</button>
                </div>
            `;
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            window.location.reload();
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchProducts();
        });
    </script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/ai-chat.js"></script>
</body>
</html>
