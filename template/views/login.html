<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Ryan Mall</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .login-container {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }
        .login-form {
            padding: 48px 40px;
        }
        .login-header {
            margin-bottom: 36px;
        }
        .login-header h2 {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }
        .login-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .form-floating {
            margin-bottom: 18px;
        }
        .btn-login {
            background: var(--accent);
            border: none;
            padding: 13px;
            font-weight: 600;
            border-radius: var(--radius-md);
        }
        .btn-login:hover {
            background: var(--accent-hover);
            box-shadow: var(--shadow-accent);
            transform: translateY(-1px);
        }
        .divider {
            text-align: center;
            margin: 28px 0;
            position: relative;
        }
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border-light);
        }
        .divider span {
            background: var(--bg-card);
            padding: 0 16px;
            color: var(--text-tertiary);
            font-size: 0.85rem;
            position: relative;
        }
        .demo-section {
            background: var(--bg-elevated);
            padding: 48px 36px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .demo-account {
            background: var(--bg-card);
            border: 1.5px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all var(--duration) var(--ease);
        }
        .demo-account:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>
<body>
    <div class="login-container fade-in-up">
        <div class="row g-0">
            <!-- Login Form -->
            <div class="col-md-6">
                <div class="login-form">
                    <div class="login-header">
                        <a href="index.html" style="text-decoration: none; color: inherit;">
                            <p style="color: var(--accent); font-weight: 500; font-size: 0.85rem; margin-bottom: 4px;"><i class="bi bi-shop"></i> Ryan Mall</p>
                        </a>
                        <h2>欢迎回来</h2>
                        <p>登录您的账户以继续</p>
                    </div>

                    <!-- Error Alert -->
                    <div id="errorAlert" class="alert alert-danger d-none" role="alert">
                        <i class="bi bi-exclamation-triangle"></i>
                        <span id="errorMessage"></span>
                    </div>

                    <!-- Success Alert -->
                    <div id="successAlert" class="alert alert-success d-none" role="alert">
                        <i class="bi bi-check-circle"></i>
                        <span id="successMessage"></span>
                    </div>

                    <!-- Login Form -->
                    <form id="loginForm">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="username" placeholder="用户名" required>
                            <label for="username">用户名</label>
                        </div>

                        <div class="form-floating">
                            <input type="password" class="form-control" id="password" placeholder="密码" required>
                            <label for="password">密码</label>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe" style="font-size: 0.88rem; color: var(--text-secondary);">
                                记住我
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary btn-login w-100" id="loginBtn">
                            <span id="loginBtnText">登录</span>
                            <span id="loginBtnLoading" class="d-none">
                                <span class="spinner-border spinner-border-sm me-2"></span>
                                登录中...
                            </span>
                        </button>
                    </form>

                    <div class="divider">
                        <span>或者</span>
                    </div>

                    <div class="text-center">
                        <p style="color: var(--text-secondary); font-size: 0.88rem; margin-bottom: 12px;">还没有账户？</p>
                        <button class="btn btn-outline-secondary" onclick="showRegisterForm()">立即注册</button>
                    </div>
                </div>
            </div>

            <!-- Demo Accounts -->
            <div class="col-md-6">
                <div class="demo-section h-100">
                    <h5 style="font-family: var(--font-display); font-weight: 600; margin-bottom: 4px;">快速体验</h5>
                    <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 24px;">使用演示账户快速体验系统</p>

                    <div class="demo-account" onclick="fillDemoAccount('admin', 'admin123')">
                        <div class="d-flex align-items-center">
                            <div style="width: 40px; height: 40px; background: var(--accent-light); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; margin-right: 14px;">
                                <i class="bi bi-shield-check" style="color: var(--accent);"></i>
                            </div>
                            <div>
                                <h6 style="margin-bottom: 2px; font-size: 0.9rem;">管理员</h6>
                                <small style="color: var(--text-tertiary);">admin / admin123</small>
                            </div>
                        </div>
                    </div>

                    <div class="demo-account" onclick="fillDemoAccount('user1', 'password123')">
                        <div class="d-flex align-items-center">
                            <div style="width: 40px; height: 40px; background: var(--secondary-light); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; margin-right: 14px;">
                                <i class="bi bi-person" style="color: var(--secondary);"></i>
                            </div>
                            <div>
                                <h6 style="margin-bottom: 2px; font-size: 0.9rem;">普通用户</h6>
                                <small style="color: var(--text-tertiary);">user1 / password123</small>
                            </div>
                        </div>
                    </div>

                    <div style="margin-top: 24px; padding: 20px; background: var(--bg-card); border-radius: var(--radius-md); border: 1px solid var(--border-light);">
                        <h6 style="font-size: 0.85rem; font-weight: 600; margin-bottom: 10px;">功能概览</h6>
                        <ul style="list-style: none; padding: 0; margin: 0; font-size: 0.82rem; color: var(--text-secondary);">
                            <li style="padding: 4px 0;"><i class="bi bi-check2 text-accent me-2"></i>浏览商品与分类</li>
                            <li style="padding: 4px 0;"><i class="bi bi-check2 text-accent me-2"></i>购物车管理</li>
                            <li style="padding: 4px 0;"><i class="bi bi-check2 text-accent me-2"></i>下单与支付模拟</li>
                            <li style="padding: 4px 0;"><i class="bi bi-check2 text-accent me-2"></i>管理员商品管理</li>
                        </ul>
                    </div>

                    <div class="mt-3 text-center">
                        <a href="index.html" style="color: var(--text-secondary); font-size: 0.85rem; text-decoration: none;">
                            <i class="bi bi-arrow-left"></i> 返回首页
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Register Modal -->
    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">注册账户</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="regUsername" placeholder="用户名" required>
                            <label for="regUsername">用户名</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="regEmail" placeholder="邮箱" required>
                            <label for="regEmail">邮箱</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="regPassword" placeholder="密码" required>
                            <label for="regPassword">密码</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="regConfirmPassword" placeholder="确认密码" required>
                            <label for="regConfirmPassword">确认密码</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="register()">注册</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8080/api/v1';

        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('token');
            if (token) {
                window.location.href = 'products.html';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            await login();
        });

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }

            setLoading(true);
            hideAlerts();

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.code === 200) {
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('username', data.data.user.username);
                    showSuccess('登录成功，正在跳转...');
                    setTimeout(() => { window.location.href = 'products.html'; }, 800);
                } else {
                    showError(data.message || '登录失败');
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
            } finally {
                setLoading(false);
            }
        }

        async function register() {
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            if (!username || !email || !password || !confirmPassword) {
                alert('请填写所有字段');
                return;
            }
            if (password !== confirmPassword) {
                alert('两次输入的密码不一致');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (data.code === 200) {
                    alert('注册成功！请登录');
                    bootstrap.Modal.getInstance(document.getElementById('registerModal')).hide();
                    document.getElementById('username').value = username;
                    document.getElementById('password').value = password;
                } else {
                    alert('注册失败: ' + data.message);
                }
            } catch (error) {
                alert('网络错误，请稍后重试');
            }
        }

        function fillDemoAccount(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }

        function showRegisterForm() {
            new bootstrap.Modal(document.getElementById('registerModal')).show();
        }

        function setLoading(loading) {
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('loginBtnText');
            const btnLoading = document.getElementById('loginBtnLoading');
            btn.disabled = loading;
            btnText.classList.toggle('d-none', loading);
            btnLoading.classList.toggle('d-none', !loading);
        }

        function showError(message) {
            const alert = document.getElementById('errorAlert');
            document.getElementById('errorMessage').textContent = message;
            alert.classList.remove('d-none');
            setTimeout(() => alert.classList.add('d-none'), 3000);
        }

        function showSuccess(message) {
            const alert = document.getElementById('successAlert');
            document.getElementById('successMessage').textContent = message;
            alert.classList.remove('d-none');
        }

        function hideAlerts() {
            document.getElementById('errorAlert').classList.add('d-none');
            document.getElementById('successAlert').classList.add('d-none');
        }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !document.querySelector('.modal.show')) {
                login();
            }
        });
    </script>
</body>
</html>
