<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - Ryan Mall</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/ai_chat.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-shop"></i> Ryan Mall</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">商品</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="cart.html">购物车</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="orders.html">订单</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="login.html" id="loginLink"><i class="bi bi-person"></i> 登录</a>
                    </li>
                    <li class="nav-item d-none" id="userMenu">
                        <div class="dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                                <i class="bi bi-person-circle"></i> <span id="username"></span>
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="orders.html">我的订单</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="#" onclick="logout()">退出登录</a></li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="cart-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <p class="text-accent fw-500 mb-2" style="font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase;">Shopping Cart</p>
                    <h1 style="font-family: var(--font-display); font-weight: 700; font-size: 2rem; letter-spacing: -0.02em; margin-bottom: 8px;">我的购物车</h1>
                    <p style="color: var(--text-secondary); font-size: 0.9rem; margin: 0;">管理您的购物车商品</p>
                </div>
                <div class="col-md-4 text-md-end">
                    <button class="btn btn-outline-danger btn-sm" onclick="clearCart()">
                        <i class="bi bi-trash"></i> 清空购物车
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <div class="container" style="padding: 48px 0;">
        <!-- Loading -->
        <div class="loading" id="loading" style="display: none;">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <p style="margin-top: 16px; font-size: 0.9rem;">正在加载购物车...</p>
        </div>

        <!-- Cart Content -->
        <div class="row" id="cartContent">
            <!-- Cart Items -->
            <div class="col-lg-8">
                <div id="cartItems">
                </div>
            </div>

            <!-- Cart Summary -->
            <div class="col-lg-4">
                <div class="cart-summary" id="cartSummary">
                    <h5 style="font-family: var(--font-display); font-weight: 600; margin-bottom: 24px;">订单汇总</h5>

                    <div class="summary-row">
                        <span>商品数量</span>
                        <span id="totalItems">0 件</span>
                    </div>
                    <div class="summary-row">
                        <span>商品总价</span>
                        <span id="subtotal">&yen;0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>运费</span>
                        <span id="shipping">免费</span>
                    </div>
                    <div class="summary-row">
                        <span>优惠</span>
                        <span id="discount" style="color: #4a9e6f;">-&yen;0.00</span>
                    </div>
                    <div class="summary-row summary-total">
                        <span>总计</span>
                        <span id="total" class="text-accent">&yen;0.00</span>
                    </div>

                    <div class="d-grid gap-2" style="margin-top: 24px;">
                        <button class="btn checkout-btn" onclick="proceedToCheckout()">
                            <i class="bi bi-credit-card"></i> 立即结算
                        </button>
                        <a href="products.html" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> 继续购物
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty Cart -->
        <div class="empty-cart d-none" id="emptyCart">
            <i class="bi bi-cart-x" style="font-size: 4rem; color: var(--border);"></i>
            <h4 style="margin-top: 24px; font-family: var(--font-display); color: var(--text-secondary);">购物车是空的</h4>
            <p style="color: var(--text-tertiary); font-size: 0.9rem;">快去挑选您喜欢的商品吧</p>
            <a href="products.html" class="btn btn-primary btn-lg" style="margin-top: 16px;">
                去购物
            </a>
        </div>
    </div>

    <!-- Recommended -->
    <section class="bg-section" style="padding: 64px 0;" id="recommendedSection">
        <div class="container">
            <h4 style="font-family: var(--font-display); font-weight: 600; text-align: center; margin-bottom: 32px;">为您推荐</h4>
            <div class="row" id="recommendedProducts">
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        let cartData = null;

        document.addEventListener('DOMContentLoaded', function() {
            checkLoginStatus();
            loadCart();
        });

        function checkLoginStatus() {
            if (!AuthManager.isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }
            updateNavbarUserStatus();
        }

        async function loadCart() {
            showLoading(true);
            try {
                const response = await api.get('/cart');
                if (response.code === 200) {
                    cartData = response.data;
                    renderCart();
                } else {
                    showError('加载购物车失败: ' + response.message);
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
            } finally {
                showLoading(false);
            }
        }

        function renderCart() {
            const cartItems = document.getElementById('cartItems');
            const cartContent = document.getElementById('cartContent');
            const emptyCart = document.getElementById('emptyCart');
            const recommendedSection = document.getElementById('recommendedSection');

            if (!cartData || !cartData.items || cartData.items.length === 0) {
                cartContent.classList.add('d-none');
                emptyCart.classList.remove('d-none');
                recommendedSection.style.display = 'block';
                loadRecommendedProducts();
                return;
            }

            cartContent.classList.remove('d-none');
            emptyCart.classList.add('d-none');
            recommendedSection.style.display = 'none';

            cartItems.innerHTML = cartData.items.map(item => `
                <div class="cart-item" data-item-id="${item.id}">
                    <div class="row align-items-center">
                        <div class="col-md-2">
                            <div class="product-image" style="width: 80px; height: 80px; border-radius: var(--radius-sm);">
                                <i class="bi bi-image" style="font-size: 1.5rem;"></i>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <h6 style="font-family: var(--font-display); font-weight: 600; font-size: 0.92rem; margin-bottom: 4px;">${item.product_name}</h6>
                            <small style="color: var(--text-tertiary);">单价: &yen;${item.price}</small>
                        </div>
                        <div class="col-md-3">
                            <div class="quantity-control">
                                <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">
                                    <i class="bi bi-dash"></i>
                                </button>
                                <input type="number" class="quantity-input" value="${item.quantity}"
                                       min="1" max="${item.stock}"
                                       onchange="updateQuantity(${item.id}, this.value)">
                                <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">
                                    <i class="bi bi-plus"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-2 text-center">
                            <div style="font-family: var(--font-display); font-weight: 600; color: var(--accent);">&yen;${item.total_price.toFixed(2)}</div>
                        </div>
                        <div class="col-md-1 text-end">
                            <button class="btn btn-outline-danger btn-sm" onclick="removeItem(${item.id})" style="border: none; padding: 6px 8px;">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            updateSummary();
        }

        function updateSummary() {
            if (!cartData || !cartData.items) return;
            const totalItems = cartData.items.reduce((sum, item) => sum + item.quantity, 0);
            const subtotal = cartData.items.reduce((sum, item) => sum + item.total_price, 0);
            const shipping = subtotal >= 99 ? 0 : 10;
            const discount = 0;
            const total = subtotal + shipping - discount;

            document.getElementById('totalItems').textContent = `${totalItems} 件`;
            document.getElementById('subtotal').textContent = `¥${subtotal.toFixed(2)}`;
            document.getElementById('shipping').textContent = shipping === 0 ? '免费' : `¥${shipping.toFixed(2)}`;
            document.getElementById('discount').textContent = `-¥${discount.toFixed(2)}`;
            document.getElementById('total').textContent = `¥${total.toFixed(2)}`;
        }

        async function updateQuantity(itemId, newQuantity) {
            newQuantity = parseInt(newQuantity);
            if (newQuantity < 1) {
                if (await Utils.showConfirm('确定要移除这个商品吗？', '确认移除')) {
                    removeItem(itemId);
                }
                return;
            }
            try {
                const response = await api.put(`/cart/${itemId}`, { quantity: newQuantity });
                if (response.code === 200) {
                    Utils.showToast('数量已更新', 'success');
                    loadCart();
                } else {
                    Utils.showToast(response.message || '更新失败', 'danger');
                }
            } catch (error) {
                Utils.showToast('网络错误', 'danger');
            }
        }

        async function removeItem(itemId) {
            try {
                const response = await api.delete(`/cart/${itemId}`);
                if (response.code === 200) {
                    Utils.showToast('已移除', 'success');
                    loadCart();
                    CartManager.updateCartBadge();
                } else {
                    Utils.showToast(response.message || '移除失败', 'danger');
                }
            } catch (error) {
                Utils.showToast('网络错误', 'danger');
            }
        }

        async function clearCart() {
            if (!await Utils.showConfirm('确定要清空购物车吗？', '确认清空')) return;
            try {
                const response = await api.delete('/cart');
                if (response.code === 200) {
                    Utils.showToast('购物车已清空', 'success');
                    loadCart();
                    CartManager.updateCartBadge();
                } else {
                    Utils.showToast(response.message || '清空失败', 'danger');
                }
            } catch (error) {
                Utils.showToast('网络错误', 'danger');
            }
        }

        function proceedToCheckout() {
            if (!cartData || !cartData.items || cartData.items.length === 0) {
                Utils.showToast('购物车是空的', 'warning');
                return;
            }
            window.location.href = 'orders.html?action=create';
        }

        async function loadRecommendedProducts() {
            try {
                const response = await api.get('/products', { limit: 4, sort: 'created_at desc' });
                if (response.code === 200 && response.data.products) {
                    renderRecommendedProducts(response.data.products);
                }
            } catch (error) {}
        }

        function renderRecommendedProducts(products) {
            document.getElementById('recommendedProducts').innerHTML = products.map(product => `
                <div class="col-md-3 mb-4">
                    <div class="card product-card">
                        <div class="product-image" style="height: 160px;">
                            <i class="bi bi-image" style="font-size: 2rem;"></i>
                        </div>
                        <div class="card-body" style="padding: 16px;">
                            <h6 style="font-family: var(--font-display); font-weight: 600; font-size: 0.88rem; margin-bottom: 8px;">${product.name}</h6>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="price" style="font-size: 1rem;">&yen;${product.price}</span>
                                <button class="btn btn-primary btn-sm" onclick="addToCartFromRecommended(${product.id})">
                                    <i class="bi bi-cart-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function addToCartFromRecommended(productId) {
            const success = await CartManager.addToCart(productId, 1);
            if (success) loadCart();
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        function showError(message) {
            document.getElementById('cartItems').innerHTML = `
                <div class="text-center" style="padding: 60px 20px;">
                    <i class="bi bi-exclamation-triangle" style="font-size: 2.5rem; color: var(--border);"></i>
                    <h5 style="color: var(--text-secondary); margin-top: 16px;">加载失败</h5>
                    <p style="color: var(--text-tertiary); font-size: 0.88rem;">${message}</p>
                    <button class="btn btn-primary" onclick="loadCart()">重新加载</button>
                </div>
            `;
        }
    </script>
    <script src="/static/js/ai-chat.js"></script>
</body>
</html>
