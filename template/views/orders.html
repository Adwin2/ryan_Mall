<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单 - Ryan Mall</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/ai_chat.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-shop"></i> Ryan Mall</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">商品</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">购物车 <span class="badge bg-danger" id="cartCount">0</span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="orders.html">订单</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="login.html" id="loginLink"><i class="bi bi-person"></i> 登录</a>
                    </li>
                    <li class="nav-item d-none" id="userMenu">
                        <div class="dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                                <i class="bi bi-person-circle"></i> <span id="username"></span>
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="orders.html">我的订单</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="#" onclick="logout()">退出登录</a></li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="orders-header">
        <div class="container">
            <p class="text-accent fw-500 mb-2" style="font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase;">My Orders</p>
            <h1 style="font-family: var(--font-display); font-weight: 700; font-size: 2rem; letter-spacing: -0.02em; margin-bottom: 8px;">我的订单</h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin: 0;">查看和管理您的所有订单</p>
        </div>
    </section>

    <!-- Main Content -->
    <div class="container" style="padding: 48px 0;">
        <!-- Create Order Section -->
        <div class="d-none" id="createOrderSection" style="background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 28px; margin-bottom: 28px;">
            <h5 style="font-family: var(--font-display); font-weight: 600; margin-bottom: 8px;">创建新订单</h5>
            <p style="color: var(--text-secondary); font-size: 0.88rem; margin-bottom: 20px;">从购物车创建订单</p>
            <div class="d-flex gap-3">
                <button class="btn btn-primary" onclick="createOrderFromCart()">
                    <i class="bi bi-cart-check"></i> 从购物车创建
                </button>
                <button class="btn btn-outline-secondary" onclick="hideCreateOrderSection()">
                    <i class="bi bi-arrow-left"></i> 返回列表
                </button>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <h6 style="font-family: var(--font-display); font-weight: 600; margin-bottom: 16px; font-size: 0.9rem;">订单状态</h6>
            <div class="d-flex flex-wrap">
                <span class="filter-tab active" data-status="" onclick="filterOrders('')">全部</span>
                <span class="filter-tab" data-status="pending" onclick="filterOrders('pending')">待支付</span>
                <span class="filter-tab" data-status="paid" onclick="filterOrders('paid')">已支付</span>
                <span class="filter-tab" data-status="shipped" onclick="filterOrders('shipped')">已发货</span>
                <span class="filter-tab" data-status="delivered" onclick="filterOrders('delivered')">已完成</span>
                <span class="filter-tab" data-status="cancelled" onclick="filterOrders('cancelled')">已取消</span>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading" style="display: none;">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <p style="margin-top: 16px; font-size: 0.9rem;">正在加载订单...</p>
        </div>

        <!-- Orders List -->
        <div id="ordersList">
        </div>

        <!-- Empty State -->
        <div class="empty-orders d-none" id="emptyOrders">
            <i class="bi bi-receipt" style="font-size: 4rem; color: var(--border);"></i>
            <h4 style="margin-top: 24px; font-family: var(--font-display); color: var(--text-secondary);">暂无订单</h4>
            <p style="color: var(--text-tertiary); font-size: 0.9rem;">快去购物吧</p>
            <a href="products.html" class="btn btn-primary btn-lg" style="margin-top: 16px;">去购物</a>
        </div>

        <!-- Pagination -->
        <nav aria-label="订单分页" class="mt-5">
            <ul class="pagination justify-content-center" id="pagination">
            </ul>
        </nav>
    </div>

    <!-- Order Detail Modal -->
    <div class="modal fade" id="orderDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">订单详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="orderDetailBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">关闭</button>
                    <div id="orderDetailActions">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        const API_BASE = 'http://localhost:8081/api/v1';

        let currentStatus = '';
        let currentPage = 1;
        let selectedOrder = null;

        document.addEventListener('DOMContentLoaded', function() {
            checkLoginStatus();
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('action') === 'create') {
                showCreateOrderSection();
            } else {
                loadOrders();
            }
            CartManager.updateCartBadge();
        });

        function checkLoginStatus() {
            if (!AuthManager.isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }
            updateNavbarUserStatus();
        }

        function showCreateOrderSection() {
            document.getElementById('createOrderSection').classList.remove('d-none');
        }

        function hideCreateOrderSection() {
            document.getElementById('createOrderSection').classList.add('d-none');
            window.history.replaceState({}, '', 'orders.html');
        }

        async function createOrderFromCart() {
            try {
                const cartResponse = await api.get('/cart');
                if (cartResponse.code !== 200 || !cartResponse.data.items || cartResponse.data.items.length === 0) {
                    Utils.showToast('购物车是空的', 'warning');
                    return;
                }
                const cartItemIds = cartResponse.data.items.map(item => item.id);
                const orderResponse = await api.post('/orders', {
                    cart_item_ids: cartItemIds,
                    shipping_address: {
                        name: "默认收货人", phone: "13800138000",
                        province: "北京市", city: "北京市", district: "朝阳区",
                        address: "默认地址", zipcode: "100000"
                    },
                    payment_method: "alipay",
                    contact_phone: "13800138000",
                    remark: "从购物车创建的订单"
                });
                if (orderResponse.code === 200) {
                    Utils.showToast('订单创建成功', 'success');
                    hideCreateOrderSection();
                    loadOrders();
                    CartManager.updateCartBadge();
                } else {
                    Utils.showToast(orderResponse.message || '创建失败', 'danger');
                }
            } catch (error) {
                Utils.showToast('网络错误', 'danger');
            }
        }

        async function loadOrders(page = 1) {
            showLoading(true);
            try {
                const params = { page, page_size: 10 };
                if (currentStatus) params.status = currentStatus;
                const response = await api.get('/orders', params);
                if (response.code === 200) {
                    renderOrders(response.data.orders || []);
                    renderPagination(response.data.pagination || {});
                } else {
                    showError('加载订单失败: ' + response.message);
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
            } finally {
                showLoading(false);
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('ordersList');
            const emptyOrders = document.getElementById('emptyOrders');

            if (orders.length === 0) {
                container.innerHTML = '';
                emptyOrders.classList.remove('d-none');
                return;
            }

            emptyOrders.classList.add('d-none');
            container.innerHTML = orders.map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <div class="row align-items-center">
                            <div class="col-md-3">
                                <strong style="font-size: 0.85rem;">${order.order_no}</strong>
                            </div>
                            <div class="col-md-3">
                                <small style="color: var(--text-tertiary);">${Utils.formatDate(order.created_at)}</small>
                            </div>
                            <div class="col-md-3">
                                <span class="status-badge status-${order.status}">${getStatusText(order.status)}</span>
                            </div>
                            <div class="col-md-3 text-end">
                                <strong class="text-accent">&yen;${order.total_amount}</strong>
                            </div>
                        </div>
                    </div>
                    <div class="order-body">
                        ${order.order_items ? order.order_items.map(item => `
                            <div class="order-item">
                                <div class="product-image" style="width: 56px; height: 56px; margin-right: 16px; border-radius: var(--radius-sm);">
                                    <i class="bi bi-image" style="font-size: 1.2rem;"></i>
                                </div>
                                <div class="flex-grow-1">
                                    <h6 style="font-size: 0.88rem; margin-bottom: 2px;">${item.product_name}</h6>
                                    <small style="color: var(--text-tertiary);">&yen;${item.price} x ${item.quantity}</small>
                                </div>
                                <div style="font-weight: 600; font-size: 0.9rem;">&yen;${item.total_price.toFixed(2)}</div>
                            </div>
                        `).join('') : '<p style="color: var(--text-tertiary); font-size: 0.88rem;">暂无商品信息</p>'}
                        <div class="d-flex gap-2 mt-3 flex-wrap">
                            <button class="btn btn-outline-primary btn-sm" onclick="showOrderDetail(${order.id})">
                                查看详情
                            </button>
                            ${getOrderActions(order)}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getStatusText(status) {
            const map = { pending: '待支付', paid: '已支付', shipped: '已发货', delivered: '已完成', cancelled: '已取消' };
            return map[status] || status;
        }

        function getOrderActions(order) {
            switch (order.status) {
                case 'pending': return `
                    <button class="btn btn-success btn-sm" onclick="payOrder(${order.id})">立即支付</button>
                    <button class="btn btn-outline-danger btn-sm" onclick="cancelOrder(${order.id})">取消</button>`;
                case 'shipped': return `
                    <button class="btn btn-primary btn-sm" onclick="confirmOrder(${order.id})">确认收货</button>`;
                case 'delivered': return `
                    <button class="btn btn-outline-secondary btn-sm" onclick="reorderOrder(${order.id})">再次购买</button>`;
                default: return '';
            }
        }

        function filterOrders(status) {
            currentStatus = status;
            currentPage = 1;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-status="${status}"]`).classList.add('active');
            loadOrders(currentPage);
        }

        async function showOrderDetail(orderId) {
            try {
                const response = await api.get(`/orders/${orderId}`);
                if (response.code === 200) {
                    selectedOrder = response.data;
                    renderOrderDetail();
                    new bootstrap.Modal(document.getElementById('orderDetailModal')).show();
                } else {
                    Utils.showToast('获取详情失败', 'danger');
                }
            } catch (error) {
                Utils.showToast('网络错误', 'danger');
            }
        }

        function renderOrderDetail() {
            if (!selectedOrder) return;
            const order = selectedOrder;
            document.getElementById('orderDetailBody').innerHTML = `
                <div class="row g-4">
                    <div class="col-md-6">
                        <h6 style="font-family: var(--font-display); font-weight: 600; margin-bottom: 16px;">订单信息</h6>
                        <table style="width: 100%; font-size: 0.88rem;">
                            <tr style="border-bottom: 1px solid var(--divider);"><td style="padding: 10px 0; color: var(--text-secondary);">订单号</td><td style="padding: 10px 0; text-align: right;">${order.order_no}</td></tr>
                            <tr style="border-bottom: 1px solid var(--divider);"><td style="padding: 10px 0; color: var(--text-secondary);">状态</td><td style="padding: 10px 0; text-align: right;"><span class="status-badge status-${order.status}">${getStatusText(order.status)}</span></td></tr>
                            <tr style="border-bottom: 1px solid var(--divider);"><td style="padding: 10px 0; color: var(--text-secondary);">时间</td><td style="padding: 10px 0; text-align: right;">${Utils.formatDate(order.created_at)}</td></tr>
                            <tr><td style="padding: 10px 0; color: var(--text-secondary);">总额</td><td style="padding: 10px 0; text-align: right; font-weight: 600; color: var(--accent);">&yen;${order.total_amount}</td></tr>
                        </table>
                    </div>
                    <div class="col-md-6">
                        <h6 style="font-family: var(--font-display); font-weight: 600; margin-bottom: 16px;">商品清单</h6>
                        ${order.order_items ? order.order_items.map(item => `
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--divider); font-size: 0.88rem;">
                                <div>
                                    <div style="font-weight: 500;">${item.product_name}</div>
                                    <small style="color: var(--text-tertiary);">&yen;${item.price} x ${item.quantity}</small>
                                </div>
                                <strong>&yen;${item.total_price.toFixed(2)}</strong>
                            </div>
                        `).join('') : '<p style="color: var(--text-tertiary);">暂无商品信息</p>'}
                    </div>
                </div>
            `;
            document.getElementById('orderDetailActions').innerHTML = getOrderActions(order);
        }

        async function payOrder(orderId) {
            if (!await Utils.showConfirm('确定支付？', '确认支付')) return;
            try {
                const response = await api.post(`/orders/${orderId}/pay`);
                if (response.code === 200) {
                    Utils.showToast('支付成功', 'success');
                    loadOrders(currentPage);
                    const modal = bootstrap.Modal.getInstance(document.getElementById('orderDetailModal'));
                    if (modal) modal.hide();
                } else {
                    Utils.showToast(response.message || '支付失败', 'danger');
                }
            } catch (error) {
                Utils.showToast('网络错误', 'danger');
            }
        }

        async function cancelOrder(orderId) {
            if (!await Utils.showConfirm('确定取消？', '确认取消')) return;
            try {
                const response = await api.put(`/orders/${orderId}/cancel`);
                if (response.code === 200) {
                    Utils.showToast('已取消', 'success');
                    loadOrders(currentPage);
                    const modal = bootstrap.Modal.getInstance(document.getElementById('orderDetailModal'));
                    if (modal) modal.hide();
                } else {
                    Utils.showToast(response.message || '取消失败', 'danger');
                }
            } catch (error) {
                Utils.showToast('网络错误', 'danger');
            }
        }

        async function confirmOrder(orderId) {
            if (!await Utils.showConfirm('确认收货？', '确认')) return;
            try {
                const response = await api.put(`/orders/${orderId}/confirm`);
                if (response.code === 200) {
                    Utils.showToast('确认成功', 'success');
                    loadOrders(currentPage);
                    const modal = bootstrap.Modal.getInstance(document.getElementById('orderDetailModal'));
                    if (modal) modal.hide();
                } else {
                    Utils.showToast(response.message || '失败', 'danger');
                }
            } catch (error) {
                Utils.showToast('网络错误', 'danger');
            }
        }

        function reorderOrder(orderId) {
            Utils.showToast('功能开发中...', 'info');
        }

        function renderPagination(pagination) {
            const container = document.getElementById('pagination');
            if (!pagination.total_pages || pagination.total_pages <= 1) {
                container.innerHTML = '';
                return;
            }
            let html = '';
            if (pagination.current_page > 1) {
                html += `<li class="page-item"><a class="page-link" href="#" onclick="loadOrders(${pagination.current_page - 1})">上一页</a></li>`;
            }
            for (let i = 1; i <= pagination.total_pages; i++) {
                html += i === pagination.current_page
                    ? `<li class="page-item active"><span class="page-link">${i}</span></li>`
                    : `<li class="page-item"><a class="page-link" href="#" onclick="loadOrders(${i})">${i}</a></li>`;
            }
            if (pagination.current_page < pagination.total_pages) {
                html += `<li class="page-item"><a class="page-link" href="#" onclick="loadOrders(${pagination.current_page + 1})">下一页</a></li>`;
            }
            container.innerHTML = html;
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        function showError(message) {
            document.getElementById('ordersList').innerHTML = `
                <div class="text-center" style="padding: 60px 20px;">
                    <i class="bi bi-exclamation-triangle" style="font-size: 2.5rem; color: var(--border);"></i>
                    <h5 style="color: var(--text-secondary); margin-top: 16px;">加载失败</h5>
                    <p style="color: var(--text-tertiary); font-size: 0.88rem;">${message}</p>
                    <button class="btn btn-primary" onclick="loadOrders()">重新加载</button>
                </div>
            `;
        }
    </script>
    <script src="/static/js/ai-chat.js"></script>
</body>
</html>
